<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <title>Página não encontrada | Portal do Lojista</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4f46e5">
  <style>
    :root {
      color-scheme: light;
      --brand: #4f46e5;
      --ink: #14161f;
      --ink-2: #4b5163;
      --line: #e8eaf2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background-color: #f4f5fa;
      background-image:
        radial-gradient(900px 480px at 4% -12%, rgba(79, 70, 229, 0.12), transparent 62%),
        radial-gradient(800px 420px at 100% 0%, rgba(245, 165, 36, 0.12), transparent 58%);
    }

    .card {
      width: min(440px, 100%);
      padding: 32px;
      text-align: center;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 30px 70px -40px rgba(20, 22, 31, 0.5);
    }

    .mark {
      width: 52px;
      height: 52px;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: linear-gradient(135deg, #6d64f5, var(--brand));
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    h1 {
      font-size: 22px;
      letter-spacing: -0.02em;
    }

    p {
      margin-top: 8px;
      font-size: 13.5px;
      line-height: 1.6;
      color: var(--ink-2);
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 22px;
      padding: 11px 18px;
      border-radius: 11px;
      background: var(--brand);
      color: #fff;
      font-size: 13.5px;
      font-weight: 700;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 3px;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="mark" aria-hidden="true">PL</div>
    <h1>Página não encontrada</h1>
    <p>O endereço acessado não existe ou foi movido. Volte para o painel do Portal do Lojista.</p>
    <a href="/">Ir para o portal</a>
  </main>
</body>

</html>
